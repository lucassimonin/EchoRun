name: CI / Deploy

# À chaque push sur main : on vérifie (lint + typecheck), puis on déploie sur le
# serveur par SSH. Les pull requests ne font que les vérifications (pas de deploy).
# Déclenchement manuel possible depuis l'onglet Actions (workflow_dispatch).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Un seul déploiement à la fois ; on ne coupe pas un déploiement en cours.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

  deploy:
    name: Deploy to server
    needs: checks
    runs-on: ubuntu-latest
    # Jamais sur une pull request : uniquement push sur main (ou lancement manuel).
    if: github.event_name != 'pull_request'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            echo "→ Mise à jour du code (origin/main)"
            git fetch --all --prune
            git reset --hard origin/main
            echo "→ Build & (re)démarrage des conteneurs"
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build --remove-orphans
            echo "→ Nettoyage des images inutilisées"
            docker image prune -f
            echo "✓ Déploiement terminé"
